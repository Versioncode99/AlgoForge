[project]
name = "algoforge"
version = "0.1.0"
description = "Private, paper-only quantitative research and prop simulation workstation"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "databento>=0.85.0",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.15,<2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pandas-stubs>=3.0.5.260730",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "scipy-stubs>=1.15",
  "types-pyyaml>=6.0.12.20260815",
]

[project.scripts]
algoforge-api = "forge_api.main:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/forge", "apps/api/forge_api"]

[tool.pytest.ini_options]
pythonpath = ["packages", "apps/api"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
# Generated + user-edited strategy artifacts are not project source.
exclude = ["strategies"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["packages", "apps/api"]
packages = ["forge", "forge_api"]
